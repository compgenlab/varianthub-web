# Development stack. Production uses deploy/k8s — keep the two independent
# rather than trying to share one definition; they have different goals (fast
# iteration vs. rolling upgrades, managed Postgres, real secrets).
#
#   make dev        build and bring it up
#   make dev-logs   follow logs
#   make dev-down   stop (keeps volumes)
#   make dev-reset  stop and DELETE volumes, for a genuinely clean start
#
# Startup order is enforced, not hoped for:
#   postgres (healthy) -> migrate (completed) -> seed (completed) -> api, worker
#
# So neither api nor worker can come up against an unmigrated schema or an empty
# catalog. The worker materializes each job's annotation config from that catalog,
# so there is no annotation tree to mount.

name: varianthub-web

# One build definition, shared. Compose builds the image once and all three
# services run it with different arguments.
x-web: &web
  image: varianthub-web:dev
  # An optional config file. Point VHW_CONFIG_FILE at a varianthub-web.toml to
  # mount it; with nothing set this mounts the in-repo example, which is
  # harmless because every value in it matches the built-in defaults.
  #   VHW_CONFIG_FILE=./my-config.toml make dev
  volumes:
    - ${VHW_CONFIG_FILE:-./varianthub-web.toml}:/etc/varianthub-web/config.toml:ro
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile
    additional_contexts:
      # The varhub CLI is compiled from your local checkout, so the stack tests
      # the CLI you actually have. Override if your checkout lives elsewhere:
      #   VARHUB_SRC=/path/to/varianthub-cli make dev
      varhub-src: ${VARHUB_SRC:-../../../cganno}
    args:
      VERSION: ${VERSION:-dev}

# The DSN stays an environment variable here because compose assembles it from
# POSTGRES_PASSWORD. Everything else can live in a mounted varianthub-web.toml —
# see VHW_CONFIG_FILE below — and the environment still wins over the file, so
# either style works and they can be mixed.
x-db-env: &db-env
  VHW_DATABASE_URL: postgres://varianthub:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/varianthub?sslmode=disable
  VHW_CONFIG: ${VHW_CONFIG:-/etc/varianthub-web/config.toml}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: varianthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: varianthub
    ports:
      # Not 5432: a dev machine usually already has one.
      - "${POSTGRES_PORT:-55441}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -d matters: without it pg_isready reports ready during the init phase,
      # when the database this app needs does not exist yet.
      test: ["CMD-SHELL", "pg_isready -U varianthub -d varianthub"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Applies pending migrations, then exits 0. Everything else waits on it.
  migrate:
    <<: *web
    command: ["migrate"]
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Puts a starter snapshot in the catalog if it is empty, then exits 0. A no-op
  # once anything exists, so it never overwrites a real catalog.
  seed:
    <<: *web
    command: ["seed"]
    environment:
      <<: *db-env
      # seed reconciles the declared storage locations into the catalog, so it
      # needs the same view of them as the worker.
      VHW_STORAGE_PATHS: ${VHW_STORAGE_PATHS:-default=/mnt/storage}
      # Object-store target and credentials. Empty unless the s3 profile is in
      # use — an endpoint with no gateway behind it is worse than none.
      VHW_STORAGE_S3: ${VHW_STORAGE_S3:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-varhubdev}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-varhubdevsecret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *web
    command: ["serve"]
    environment:
      <<: *db-env
      VHW_ADDR: ":8080"
      # serve reconciles the declared storage locations into the catalog, so it
      # needs the same view of them as the worker. Leaving it out here means the
      # catalog keeps a stale path and downloads go somewhere nobody mounted.
      VHW_STORAGE_PATHS: ${VHW_STORAGE_PATHS:-default=/mnt/storage}
      # Object-store target and credentials. Empty unless the s3 profile is in
      # use — an endpoint with no gateway behind it is worse than none.
      VHW_STORAGE_S3: ${VHW_STORAGE_S3:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-varhubdev}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-varhubdevsecret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # The Vite dev server's origin, so a locally-run front-end can call the API.
      VHW_CORS_ORIGINS: ${VHW_CORS_ORIGINS:-http://localhost:5173}
    ports:
      # Not 8080: like postgres above, a dev machine usually already has one.
      - "${API_PORT:-18080}:8080"
    # Lets a container reach a service on the host, which is how a streamed
    # source pointed at a locally-served file resolves. Docker Desktop provides
    # this name; on Linux it has to be mapped explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  worker:
    <<: *web
    command: ["worker"]
    environment:
      <<: *db-env
      VHW_WORKERS: ${VHW_WORKERS:-2}
      VHW_VARHUB_BIN: /usr/local/bin/varhub
      # No VHW_VARHUB_HOME: the worker materializes each job's config from the
      # catalog. Set it to bypass the catalog and use a fixed tree instead.
      VHW_DATA_DIR: /var/lib/varianthub/data
      VHW_CACHE_DIR: /var/lib/varianthub/cache
      # Filesystem download targets, "name=/abs/path", first is the default.
      # A path only means something if the worker mounts it, so these are
      # declared here rather than added through the UI.
      VHW_STORAGE_PATHS: ${VHW_STORAGE_PATHS:-default=/mnt/storage}
      # Object-store target and credentials. Empty unless the s3 profile is in
      # use — an endpoint with no gateway behind it is worse than none.
      VHW_STORAGE_S3: ${VHW_STORAGE_S3:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-varhubdev}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-varhubdevsecret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes:
      # Working data: tool images, reference files, the annotation cache.
      - varhub-data:/var/lib/varianthub
      # Downloaded source data, always mounted at /mnt/storage inside the
      # container so VHW_STORAGE_PATHS does not have to change with the host.
      #
      # Defaults to a named volume so a clean checkout works anywhere. Set
      # VHW_HOST_STORAGE to an absolute host path to bind-mount a real disk
      # instead — docker reads a value with a leading "/" as a bind mount and a
      # bare name as a named volume, so one variable covers both. Reference data
      # runs to hundreds of gigabytes, so a dedicated disk is the norm.
      - ${VHW_HOST_STORAGE:-varhub-sources}:/mnt/storage
    # Lets a container reach a service on the host, which is how a streamed
    # source pointed at a locally-served file resolves. Docker Desktop provides
    # this name; on Linux it has to be mapped explicitly.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # Optional S3-compatible object store for exercising the bucket path locally.
  #
  # Off by default: it only starts with `--profile s3` (or COMPOSE_PROFILES=s3),
  # because the stack is perfectly usable with a filesystem volume alone and
  # most dev work does not need a bucket. Production does not use this at all —
  # deploy/k8s points at a real object store.
  #
  # versitygw's posix backend treats each top-level directory under its root as
  # a bucket, so the bucket is created by making a directory.
  s3:
    image: versity/versitygw:latest
    profiles: ["s3"]
    environment:
      ROOT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-varhubdev}
      ROOT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-varhubdevsecret}
    # The posix backend treats each top-level directory under its root as a
    # bucket, so creating one is mkdir. Done here rather than by hand so a fresh
    # checkout comes up with a usable bucket.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - mkdir -p /data/${S3_BUCKET:-varhub-dev} && exec versitygw --port :7070 posix /data
    ports:
      - "${S3_PORT:-17070}:7070"
    volumes:
      # Host-backed so the bucket survives `make dev-reset` and can be inspected
      # with ordinary tools — it is just a directory tree.
      - ${S3_HOST_DIR:-/mnt/data1/working/varhub-web-versitygw}:/data
    healthcheck:
      # An unauthenticated request gets a signed-request error, which is proof
      # the S3 endpoint is answering. Only a connection failure means not-ready.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7070/ >/dev/null 2>&1 || wget -S -O- http://localhost:7070/ 2>&1 | grep -q HTTP"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
  varhub-data:
  varhub-sources:
