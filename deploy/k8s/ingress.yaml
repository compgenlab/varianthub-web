# Terminates TLS and routes to the API. The Go server speaks plain HTTP by
# design — TLS is the ingress's job.
#
# VHW_TRUSTED_PROXIES in the ConfigMap must cover this controller's pod network,
# otherwise every request resolves to the proxy's IP and per-client fairness and
# rate limiting collapse into a single shared bucket.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: varianthub-web
  namespace: varianthub
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # VCF uploads; keep in step with the API's own upload ceiling.
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [varianthub.example.org]
      secretName: varianthub-web-tls
  rules:
    - host: varianthub.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: varianthub-web-api
                port: {name: http}
