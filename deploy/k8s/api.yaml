apiVersion: apps/v1
kind: Deployment
metadata:
  name: varianthub-web-api
  namespace: varianthub
spec:
  replicas: 2
  selector:
    matchLabels: {app: varianthub-web, role: api}
  template:
    metadata:
      labels: {app: varianthub-web, role: api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: varianthub-web:latest
          args: ["serve"]
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: varianthub-web}
            - secretRef:    {name: varianthub-web}
          # /healthz reports unavailable when Postgres is unreachable, so a pod
          # that cannot serve is pulled from the Service rather than taking traffic.
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          # Liveness uses /version: it must not depend on the database, or a brief
          # Postgres blip would restart every pod instead of just draining them.
          livenessProbe:
            httpGet: {path: /version, port: http}
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits:   {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
---
apiVersion: v1
kind: Service
metadata:
  name: varianthub-web-api
  namespace: varianthub
spec:
  selector: {app: varianthub-web, role: api}
  ports:
    - {name: http, port: 80, targetPort: http}
