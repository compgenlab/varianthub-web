# The job pool. Serves no HTTP, so it has no probes — liveness is "the process
# is running"; a stuck worker is caught by job TTL, not by the kubelet.
#
# Scale by replicas: workers claim with FOR UPDATE SKIP LOCKED, so N pods take N
# distinct jobs without coordination.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: varianthub-web-worker
  namespace: varianthub
spec:
  replicas: 2
  selector:
    matchLabels: {app: varianthub-web, role: worker}
  template:
    metadata:
      labels: {app: varianthub-web, role: worker}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: varianthub-web:latest
          args: ["worker"]
          envFrom:
            - configMapRef: {name: varianthub-web}
            - secretRef:    {name: varianthub-web}
          volumeMounts:
            - {name: varhub-data, mountPath: /var/lib/varianthub}
            - {name: scratch,     mountPath: /tmp}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits:   {memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      # Jobs run to completion or are re-queued by the next process start, so a
      # generous grace period avoids killing work that is nearly done.
      terminationGracePeriodSeconds: 120
      volumes:
        # Downloaded source files and the indexes built from them, shared across
        # jobs and pods. NOT the annotation config — that is materialized per job
        # from the Postgres catalog into a temp dir under /tmp.
        #
        # Chunk 4b removes this volume entirely by reading sources from S3 by
        # range request, at which point the worker is stateless.
        - name: varhub-data
          persistentVolumeClaim:
            claimName: varianthub-data
        - name: scratch
          emptyDir: {sizeLimit: 20Gi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: varianthub-data
  namespace: varianthub
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 100Gi
