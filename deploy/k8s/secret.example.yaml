# Copy to secret.yaml, fill in real values, and keep it OUT of git.
# In a real cluster prefer an external secret manager over a committed manifest.
apiVersion: v1
kind: Secret
metadata:
  name: varianthub-web
  namespace: varianthub
type: Opaque
stringData:
  # Postgres DSN. Point this at a managed instance in production.
  VHW_DATABASE_URL: postgres://varianthub:CHANGEME@postgres:5432/varianthub?sslmode=require
  # HMAC key signing API tokens. Rotating it invalidates every issued token.
  VHW_MASTER_KEY: CHANGEME-generate-with-openssl-rand-base64-32
  POSTGRES_PASSWORD: CHANGEME
