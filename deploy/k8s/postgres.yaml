# DEVELOPMENT ONLY — single replica, no backups, no failover, no pooling.
# In production delete this file and point VHW_DATABASE_URL at managed Postgres.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: varianthub
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - {name: pg, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: varianthub}
            - {name: POSTGRES_DB,   value: varianthub}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: varianthub-web, key: POSTGRES_PASSWORD}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "varianthub", "-d", "varianthub"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits:   {memory: 2Gi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: varianthub
spec:
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5432, targetPort: pg}
